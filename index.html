<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QAQEN QC - พังอยู่ แป๊บนึง</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            
            /* ลบแถบสีฟ้า/เทา เวลาเอานิ้วกดแตะบนมือถือ */
            -webkit-tap-highlight-color: transparent;
            /* ลบกรอบเวลากด (Focus outline) */
            outline: none;
            /* ป้องกันการลากคลุมดำข้อความ (ถ้าไม่ต้องการให้คลุมดำได้) */
            user-select: none; 
            -webkit-user-select: none;
        }

        *:focus {
            outline: none !important;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Kanit', sans-serif;
            
            background-color: #0b0f19;
            background-image: linear-gradient(rgba(11, 15, 25, 0.8), rgba(11, 15, 25, 0.95)), url('bg.png');
            background-size: cover;
            background-position: center;
            color: #e2e8f0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px 30px;
            background: rgba(16, 25, 46, 0.7);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 2px dashed rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(5px);
            max-width: 450px;
            width: 90%;
            cursor: default; /* ให้เคอร์เซอร์เป็นลูกศรปกติ */
        }

        .brand-name {
            font-size: 30px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .brand-name span {
            color: #00d4ff;
        }

        h1 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 10px;
            transform: rotate(-2deg);
        }

        p {
            font-size: 16px;
            color: #a8b2d1;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* ------------------ หลอดโหลดแพนกวิ้น ------------------ */
        .loading-wrapper {
            width: 100%;
            text-align: left;
            margin-top: 40px;
        }

        .loading-text {
            font-size: 13px;
            color: #00d4ff;
            margin-bottom: 5px;
            animation: blink 1s infinite;
        }

        .loading-track {
            width: 100%;
            height: 8px;
            background-color: #1e293b;
            border-radius: 10px;
            position: relative;
        }

        .loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0284c7, #00d4ff);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
            position: relative;
            animation: loadingRun 5s ease-in-out infinite;
        }

        .penguin-svg {
            position: absolute;
            right: -16px;
            bottom: 10px;
            width: 32px;
            height: 32px;
            transform-origin: bottom center;
            animation: waddle 0.25s infinite alternate;
        }

        /* ------------------ Keyframes ------------------ */
        @keyframes loadingRun {
            0% { width: 5%; }
            30% { width: 35%; }
            50% { width: 35%; }
            70% { width: 80%; }
            100% { width: 100%; }
        }

        @keyframes waddle {
            0% { transform: rotate(-15deg) translateY(-2px); }
            100% { transform: rotate(15deg) translateY(0px); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-name">QAQEN <span>QC</span></div>
        
        <h1>ทำเว็บอยู่ แป๊บนึงงงงง 🛠️</h1>
        <p>คือเว็บมันพังอ่ะ กำลังปั่นให้อยู่นะ ใจเย็นๆ อย่าเพิ่งรีบด่า 5555 <br>ไปหาข้าวกินรอก่อน เดี๋ยวเสร็จแล้วเปิดให้ใช้แน่นอน!</p>
        
        <div class="loading-wrapper">
            <div class="loading-text">กำลังปั่นโค้ดไฟลุก... 🔥</div>
            <div class="loading-track">
                <div class="loading-progress">
                    
                    <!-- โค้ดรูปแพนกวิ้น -->
                    <svg class="penguin-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#1e293b" d="M12 2c-4.4 0-8 3.6-8 8v6c0 3.3 2.7 6 6 6h4c3.3 0 6-2.7 6-6v-6c0-4.4-3.6-8-8-8z"/>
                        <path fill="#ffffff" d="M12 6c-2.8 0-5 2.2-5 5v5c0 2.2 2.2 4 5 4s5-1.8 5-4v-5c0-2.8-2.2-5-5-5z"/>
                        <circle cx="10" cy="10" r="1.5" fill="#000"/>
                        <circle cx="14" cy="10" r="1.5" fill="#000"/>
                        <path fill="#f59e0b" d="M11 12l1 2l1-2z"/>
                        <path fill="#1e293b" d="M5 12c-1.5 1.5-1 3.5 0 4s2-1 3-3z"/>
                        <path fill="#1e293b" d="M19 12c1.5 1.5 1 3.5 0 4s-2-1-3-3z"/>
                        <rect x="7" y="20" width="3" height="2" rx="1" fill="#f59e0b"/>
                        <rect x="14" y="20" width="3" height="2" rx="1" fill="#f59e0b"/>
                    </svg>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
