<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | SNOWALLSTAR</title>
  <link id="site-favicon" rel="icon" href="">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #08080a;
      --card-bg: rgba(18, 18, 22, 0.65);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-gray: #8a8a93;
      --danger: #ff4757;
      --success: #2ed573;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body { background-color: var(--bg-main); color: #ffffff; min-height: 100vh; display: flex; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #08080a; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }

    .sidebar {
      width: 280px; background: rgba(12, 12, 15, 0.9); border-right: 1px solid var(--border-color);
      backdrop-filter: blur(20px); padding: 28px 20px; display: flex; flex-direction: column; gap: 20px; z-index: 10;
      height: 100vh; position: sticky; top: 0; overflow-y: auto;
    }
    .brand-title {
      font-family: 'Bebas Neue', cursive; font-size: 2.2rem; letter-spacing: 3px; text-align: center;
      background: linear-gradient(180deg, #fff 30%, #666 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      border-bottom: 1px solid var(--border-color); padding-bottom: 20px;
    }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .nav-btn {
      width: 100%; padding: 12px 16px; background: transparent; border: 1px solid transparent; border-radius: 12px;
      color: var(--accent-gray); font-size: 0.9rem; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px;
      transition: all 0.3s ease;
    }
    .nav-btn:hover, .nav-btn.active { background: rgba(255, 255, 255, 0.06); color: #ffffff; border-color: rgba(255, 255, 255, 0.2); }
    .btn-logout { margin-top: auto; background: rgba(255, 71, 87, 0.1); color: var(--danger); border: 1px solid rgba(255, 71, 87, 0.2); }
    .btn-logout:hover { background: var(--danger); color: #ffffff; }

    .main-content { flex: 1; padding: 40px 50px; overflow-y: auto; }
    .tab-content { display: none; max-width: 1000px; }
    .tab-content.active { display: block; animation: slideUp 0.4s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .section-header { 
      font-size: 1.6rem; font-weight: 600; letter-spacing: 1px; margin-bottom: 24px; 
      display: flex; align-items: center; gap: 12px;
    }
    .section-header::before { content: ''; width: 4px; height: 24px; background: #ffffff; border-radius: 2px; }

    .card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px;
      padding: 28px; backdrop-filter: blur(15px); margin-bottom: 28px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--accent-gray); margin-bottom: 8px; text-transform: uppercase; font-weight: 500; }
    
    .form-input, .form-select {
      width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color); border-radius: 10px; color: #ffffff; font-size: 0.95rem; outline: none;
    }
    .form-select option { background: #121216; color: #fff; }
    .form-input:focus, .form-select:focus { border-color: #ffffff; box-shadow: 0 0 12px rgba(255, 255, 255, 0.2); }

    .btn-save {
      padding: 12px 28px; background: #ffffff; color: #000000; border: none; border-radius: 10px;
      font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s ease;
    }
    .btn-save:hover { background: #dddddd; transform: translateY(-2px); }

    .table-responsive { width: 100%; overflow-x: auto; }
    .custom-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; text-align: left; }
    .custom-table th, .custom-table td { padding: 16px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    .custom-table th { background: rgba(255, 255, 255, 0.03); color: var(--accent-gray); text-transform: uppercase; font-size: 0.75rem; }
    .custom-table tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .avatar-preview { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); }
    .icon-preview { width: 42px; height: 42px; border-radius: 6px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #fff; }
    
    .role-badge { padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; display: inline-block; text-transform: uppercase; }
    .role-badge.boss { background: rgba(255, 215, 0, 0.15); border: 1px solid #ffd700; color: #ffd700; }
    .role-badge.leader { background: rgba(255, 71, 87, 0.15); border: 1px solid #ff4757; color: #ff4757; }
    .role-badge.support { background: rgba(30, 144, 255, 0.15); border: 1px solid #1e90ff; color: #1e90ff; }
    .role-badge.member { background: rgba(46, 213, 115, 0.15); border: 1px solid #2ed573; color: #2ed573; }

    .btn-action-group { display: flex; gap: 8px; }
    .btn-edit { background: rgba(255, 204, 0, 0.15); color: #ffcc00; border: 1px solid rgba(255, 204, 0, 0.3); padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    .btn-del { background: rgba(255, 71, 87, 0.15); color: var(--danger); border: 1px solid rgba(255, 71, 87, 0.3); padding: 8px 14px; border-radius: 6px; cursor: pointer; }

    .status-msg { display: none; padding: 14px 20px; border-radius: 12px; margin-bottom: 24px; font-size: 0.9rem; font-weight: 500; }
    .status-msg.success { background: rgba(46, 213, 115, 0.15); border: 1px solid var(--success); color: var(--success); }
    .status-msg.error { background: rgba(255, 71, 87, 0.15); border: 1px solid var(--danger); color: var(--danger); }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
    .modal-card { background: #121216; border: 1px solid var(--border-color); border-radius: 18px; padding: 30px; width: 100%; max-width: 600px; }

    @media (max-width: 900px) { body { flex-direction: column; } .sidebar { width: 100%; height: auto; position: relative; } .main-content { padding: 20px; } }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand-title">ADMIN PANEL</div>
    <ul class="nav-list" id="sidebar-nav">
      <li><button class="nav-btn active" onclick="switchTab('index-tab', this)"><i class="fa-solid fa-sliders"></i> ตั้งค่าหน้าเว็บหลัก</button></li>
    </ul>
    <button class="nav-btn btn-logout" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button>
  </aside>

  <main class="main-content" id="main-container">
    <div id="status-box" class="status-msg"></div>

    <!-- Tab 1: Index Settings -->
    <section id="index-tab" class="tab-content active">
      <h2 class="section-header">จัดการข้อมูลหน้าเว็บหลัก</h2>
      <div class="card">
        <form id="form-index" onsubmit="saveIndexSettings(event)">
          <div class="form-group"><label>Title ตัวใหญ่ ( Main Header )</label><input type="text" id="cfg-title-large" class="form-input"></div>
          <div class="form-group"><label>Title ตัวเล็ก ( Sub Header )</label><input type="text" id="cfg-title-small" class="form-input"></div>
          <div class="form-group"><label>URL รูปภาพ Background</label><input type="url" id="cfg-bg-url" class="form-input"></div>
          <div class="form-group"><label>URL รูปภาพ Logo หน้าหลัก</label><input type="url" id="cfg-logo-url" class="form-input"></div>
          <div class="form-group"><label>FontAwesome Icon Class (ถ้าไม่มี URL Logo)</label><input type="text" id="cfg-logo-icon" class="form-input"></div>
          <div class="form-group"><label>URL Favicon เว็บ</label><input type="url" id="cfg-site-icon" class="form-input"></div>
          <button type="submit" class="btn-save" style="margin-top: 20px;"><i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูลการตั้งค่า</button>
        </form>
      </div>
    </section>
  </main>

  <!-- Modal แก้ไขสมาชิก -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-bottom: 20px; font-size: 1.3rem;"><i class="fa-solid fa-pen-to-square"></i> แก้ไขข้อมูลสมาชิก</h3>
      <form id="edit-member-form" onsubmit="saveMemberEdit(event)">
        <input type="hidden" id="edit-doc-id"><input type="hidden" id="edit-collection">
        <div class="form-group"><label>ชื่อสมาชิก</label><input type="text" id="edit-name" class="form-input" required></div>
        <div class="form-group">
          <label>ตำแหน่ง</label>
          <select id="edit-role" class="form-select" required>
            <option value="BOSS">THE BOSS</option><option value="LEADER">LEADER</option><option value="SUPPORT">SUPPORT</option><option value="MEMBER">MEMBER</option>
          </select>
        </div>
        <div class="form-group"><label>URL Facebook</label><input type="url" id="edit-facebook" class="form-input"></div>
        <div class="form-group"><label>URL รูปโปรไฟล์</label><input type="url" id="edit-avatar" class="form-input"></div>
        <div class="form-group"><label>Icon Class</label><input type="text" id="edit-icon" class="form-input"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="submit" class="btn-save" style="flex:1;">บันทึกการแก้ไข</button>
          <button type="button" class="btn-del" style="flex:1;" onclick="closeEditModal()">ยกเลิก</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCFAJqW44-Y_aHECz1GpJGckwjKn2SiX90",
      authDomain: "snowallstar-dc575.firebaseapp.com",
      projectId: "snowallstar-dc575",
      storageBucket: "snowallstar-dc575.firebasestorage.app",
      messagingSenderId: "829525776984",
      appId: "1:829525776984:web:8e0185d9646c03581bc82d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const memberConfigs = [
      { id: 'member', name: 'SNOWALLSTAR', col: 'member1_members' },
      { id: 'member2', name: 'SNOWONSTYLE', col: 'member2_members' },
      { id: 'member3', name: 'MIDAIPRO', col: 'member3_members' },
      { id: 'member4', name: 'RADUBJUKKRAPHAT', col: 'member4_members' },
      { id: 'member5', name: 'KING GHIDORAH', col: 'member5_members' }
    ];

    const sidebarNav = document.getElementById('sidebar-nav');
    const mainContainer = document.getElementById('main-container');

    memberConfigs.forEach((m, idx) => {
      sidebarNav.innerHTML += `
        <li><button class="nav-btn" onclick="switchTab('${m.id}-tab', this)"><i class="fa-solid fa-users-gear"></i> จัดการ ${m.name}</button></li>
      `;

      mainContainer.innerHTML += `
        <section id="${m.id}-tab" class="tab-content">
          <h2 class="section-header">จัดการสมาชิก ${m.name.toUpperCase()}</h2>
          <div class="card">
            <form onsubmit="addMember(event, '${m.col}', '${m.id}')">
              <div class="form-grid">
                <div class="form-group"><label>ชื่อสมาชิก (Nickname)</label><input type="text" id="${m.id}-name" class="form-input" required></div>
                <div class="form-group">
                  <label>เลือกตำแหน่ง</label>
                  <select id="${m.id}-role-select" class="form-select" required>
                    <option value="">-- เลือกตำแหน่ง --</option>
                    <option value="BOSS">THE BOSS</option>
                    <option value="LEADER">LEADER</option>
                    <option value="SUPPORT">SUPPORT</option>
                    <option value="MEMBER">MEMBER</option>
                  </select>
                </div>
                <div class="form-group"><label>URL Facebook</label><input type="url" id="${m.id}-facebook" class="form-input"></div>
                <div class="form-group"><label>URL รูปโปรไฟล์</label><input type="url" id="${m.id}-avatar" class="form-input"></div>
                <div class="form-group"><label>FontAwesome Icon</label><input type="text" id="${m.id}-icon" class="form-input" value="fa-solid fa-user"></div>
              </div>
              <button type="submit" class="btn-save"><i class="fa-solid fa-user-plus"></i> เพิ่มสมาชิก ${m.name}</button>
            </form>
          </div>

          <div class="card">
            <h3 style="font-size: 1.1rem; margin-bottom: 16px; color: #ccc;">รายชื่อสมาชิก ${m.name} ทั้งหมด</h3>
            <div class="table-responsive">
              <table class="custom-table">
                <thead><tr><th>รูป / ไอคอน</th><th>ชื่อ</th><th>ตำแหน่ง</th><th>วันที่เพิ่ม</th><th>จัดการ</th></tr></thead>
                <tbody id="${m.id}-table-body"><tr><td colspan="5" style="text-align:center; color:#666;">กำลังโหลด...</td></tr></tbody>
              </table>
            </div>
          </div>
        </section>
      `;
    });

    auth.onAuthStateChanged((user) => {
      if (!user) { window.location.href = "index.html"; } 
      else {
        loadIndexSettings();
        memberConfigs.forEach(m => bindRealtimeMembers(m.col, `${m.id}-table-body`));
      }
    });

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function showStatus(message, type) {
      const box = document.getElementById('status-box');
      box.innerText = message; box.className = `status-msg ${type}`; box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 4000);
    }

    function loadIndexSettings() {
      db.collection("settings").doc("index_page").get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          document.getElementById('cfg-title-large').value = data.titleLarge || '';
          document.getElementById('cfg-title-small').value = data.titleSmall || '';
          document.getElementById('cfg-bg-url').value = data.bgUrl || '';
          document.getElementById('cfg-logo-url').value = data.logoUrl || '';
          document.getElementById('cfg-logo-icon').value = data.logoIcon || '';
          document.getElementById('cfg-site-icon').value = data.siteIcon || '';
        }
      });
    }

    function saveIndexSettings(e) {
      e.preventDefault();
      const data = {
        titleLarge: document.getElementById('cfg-title-large').value.trim(),
        titleSmall: document.getElementById('cfg-title-small').value.trim(),
        bgUrl: document.getElementById('cfg-bg-url').value.trim(),
        logoUrl: document.getElementById('cfg-logo-url').value.trim(),
        logoIcon: document.getElementById('cfg-logo-icon').value.trim(),
        siteIcon: document.getElementById('cfg-site-icon').value.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection("settings").doc("index_page").set(data, { merge: true })
        .then(() => showStatus("บันทึกการตั้งค่าเรียบร้อยแล้ว!", "success"))
        .catch((err) => showStatus("ข้อผิดพลาด: " + err.message, "error"));
    }

    function addMember(e, collectionName, prefix) {
      e.preventDefault();
      db.collection(collectionName).add({
        name: document.getElementById(`${prefix}-name`).value.trim(),
        role: document.getElementById(`${prefix}-role-select`).value,
        facebook: document.getElementById(`${prefix}-facebook`).value.trim() || '#',
        avatar: document.getElementById(`${prefix}-avatar`).value.trim(),
        iconClass: document.getElementById(`${prefix}-icon`).value.trim() || 'fa-solid fa-user',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        showStatus("เพิ่มสมาชิกเรียบร้อยแล้ว", "success");
        e.target.reset();
      }).catch(err => showStatus("ข้อผิดพลาด: " + err.message, "error"));
    }

    function bindRealtimeMembers(collectionName, tableBodyId) {
      db.collection(collectionName).orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const tbody = document.getElementById(tableBodyId);
        if(!tbody) return;
        tbody.innerHTML = '';
        if (snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#666; padding:30px;">ยังไม่มีรายชื่อสมาชิก</td></tr>';
          return;
        }
        snapshot.forEach((doc) => {
          const m = doc.data();
          const dateStr = m.createdAt ? new Date(m.createdAt.toDate()).toLocaleDateString('th-TH') : 'ไม่ระบุ';
          let mediaElement = m.avatar 
            ? `<img src="${m.avatar}" class="avatar-preview" onerror="this.outerHTML='<div class=\\'icon-preview\\'><i class=\\'${m.iconClass || 'fa-solid fa-user'}\\'></i></div>'">`
            : `<div class="icon-preview"><i class="${m.iconClass || 'fa-solid fa-user'}"></i></div>`;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${mediaElement}</td>
            <td>${m.name}</td>
            <td><span class="role-badge ${(m.role||'member').toLowerCase()}">${m.role || 'MEMBER'}</span></td>
            <td style="color: #666; font-size: 0.8rem;">${dateStr}</td>
            <td>
              <div class="btn-action-group">
                <button class="btn-edit" onclick="openEditModal('${collectionName}', '${doc.id}', '${escapeQuotes(m.name)}', '${m.role}', '${m.facebook || ''}', '${m.avatar || ''}', '${m.iconClass || ''}')"><i class="fa-solid fa-pen"></i> แก้ไข</button>
                <button class="btn-del" onclick="deleteMember('${collectionName}', '${doc.id}', '${escapeQuotes(m.name)}')"><i class="fa-solid fa-trash"></i> ลบ</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    function escapeQuotes(str) { return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
    function openEditModal(col, id, name, role, fb, avatar, icon) {
      document.getElementById('edit-collection').value = col;
      document.getElementById('edit-doc-id').value = id;
      document.getElementById('edit-name').value = name;
      document.getElementById('edit-role').value = role || 'MEMBER';
      document.getElementById('edit-facebook').value = fb;
      document.getElementById('edit-avatar').value = avatar;
      document.getElementById('edit-icon').value = icon;
      document.getElementById('edit-modal').style.display = 'flex';
    }
    function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }
    function saveMemberEdit(e) {
      e.preventDefault();
      db.collection(document.getElementById('edit-collection').value).doc(document.getElementById('edit-doc-id').value).update({
        name: document.getElementById('edit-name').value.trim(),
        role: document.getElementById('edit-role').value,
        facebook: document.getElementById('edit-facebook').value.trim(),
        avatar: document.getElementById('edit-avatar').value.trim(),
        iconClass: document.getElementById('edit-icon').value.trim() || 'fa-solid fa-user'
      }).then(() => { showStatus("แก้ไขสำเร็จ", "success"); closeEditModal(); });
    }
    function deleteMember(col, id, name) {
      if(confirm(`ต้องการลบ "${name}" หรือไม่?`)) db.collection(col).doc(id).delete();
    }
    function handleLogout() { auth.signOut().then(() => window.location.href = "index.html"); }
  </script>
</body>
</html>
