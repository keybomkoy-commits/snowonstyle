<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MEMBERS RADUBJUKKRAPHAT</title>
  <link id="site-favicon" rel="icon" href="">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      width: 100%; min-height: 100vh; background-color: #020203; color: #ffffff;
      position: relative; overflow-x: hidden; padding-bottom: 90px; background-size: cover; background-position: center; background-attachment: fixed;
    }

    @keyframes pageEnter {
      0% { opacity: 0; transform: translateY(20px) scale(0.97); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .bg-overlay { 
      position: fixed; inset: 0; 
      background: radial-gradient(circle at 50% 0%, rgba(15, 15, 25, 0.4) 0%, rgba(2, 2, 3, 0.96) 80%); 
      z-index: 1; pointer-events: none; 
    }
    #particles-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
    
    .container { 
      position: relative; z-index: 2; max-width: 1150px; margin: 0 auto; padding: 35px 20px; 
      animation: pageEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .btn-back {
      display: inline-flex; align-items: center; gap: 8px; color: #cccccc; text-decoration: none;
      font-size: 0.9rem; font-weight: 500; background: rgba(255, 255, 255, 0.04); padding: 7px 16px;
      border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); 
      transition: all 0.3s ease;
    }
    .btn-back:hover { color: #ffffff; background: rgba(255, 255, 255, 0.15); transform: translateX(-4px); }
    
    .header-title { text-align: center; margin-bottom: 30px; }
    .main-title {
      font-family: 'Bebas Neue', cursive; font-size: clamp(2.8rem, 5.5vw, 4.2rem); letter-spacing: 5px;
      background: linear-gradient(135deg, #ffffff 0%, #777780 50%, #ffffff 100%);
      background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .search-box-wrapper { max-width: 450px; margin: 0 auto 40px auto; position: relative; }
    .search-input {
      width: 100%; padding: 12px 18px 12px 45px; background: rgba(12, 12, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #ffffff; font-size: 0.95rem; outline: none; 
      backdrop-filter: blur(12px); transition: all 0.3s ease;
    }
    .search-input:focus { border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 0 18px rgba(255, 255, 255, 0.1); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #888888; font-size: 0.95rem; }

    .category-section { margin-bottom: 40px; display: none; }
    .category-header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; padding-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .category-title { font-family: 'Bebas Neue', cursive; font-size: 1.8rem; letter-spacing: 2px; color: #ffffff; }

    .member-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
      gap: 16px; 
    }
    .member-card {
      background: rgba(12, 12, 18, 0.7); 
      border: 1px solid rgba(255, 255, 255, 0.12); 
      border-radius: 10px; 
      padding: 16px 18px; 
      display: flex; 
      align-items: center; 
      gap: 16px;
      backdrop-filter: blur(15px); 
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .member-card:hover { 
      transform: translateY(-4px); 
      background: rgba(18, 18, 26, 0.9);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7); 
    }

    .member-card.boss { border-color: rgba(255, 215, 0, 0.35); }
    .member-card.boss:hover { border-color: rgba(255, 215, 0, 0.8); box-shadow: 0 12px 28px rgba(0,0,0,0.7), 0 0 18px rgba(255,215,0,0.15); }

    .member-card.leader { border-color: rgba(255, 71, 87, 0.35); }
    .member-card.leader:hover { border-color: rgba(255, 71, 87, 0.8); box-shadow: 0 12px 28px rgba(0,0,0,0.7), 0 0 18px rgba(255,71,87,0.15); }

    .member-card.support { border-color: rgba(30, 144, 255, 0.35); }
    .member-card.support:hover { border-color: rgba(30, 144, 255, 0.8); box-shadow: 0 12px 28px rgba(0,0,0,0.7), 0 0 18px rgba(30,144,255,0.15); }

    .member-card.member { border-color: rgba(46, 213, 115, 0.35); }
    .member-card.member:hover { border-color: rgba(46, 213, 115, 0.8); box-shadow: 0 12px 28px rgba(0,0,0,0.7), 0 0 18px rgba(46,213,115,0.15); }

    .avatar-wrapper {
      width: 65px; height: 65px; border-radius: 8px; flex-shrink: 0;
      background: rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; overflow: hidden;
      position: relative; border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .avatar-img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-icon { font-size: 1.8rem; color: #ffffff; }

    .status-indicator {
      position: absolute; bottom: 3px; right: 3px; width: 9px; height: 9px;
      background-color: #2ed573; border: 1.5px solid #08080c; border-radius: 50%;
      box-shadow: 0 0 6px #2ed573;
    }

    .member-info { display: flex; flex-direction: column; align-items: flex-start; flex-grow: 1; overflow: hidden; }

    .rank-badge { 
      font-size: 0.62rem; font-weight: 700; text-transform: uppercase; margin-bottom: 3px; letter-spacing: 1.3px; 
    }
    .member-card.boss .rank-badge { color: #ffd700; }
    .member-card.leader .rank-badge { color: #ff4757; }
    .member-card.support .rank-badge { color: #1e90ff; }
    .member-card.member .rank-badge { color: #2ed573; }

    .member-name { 
      font-size: 1.15rem; font-weight: 700; color: #ffffff; margin-bottom: 7px; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; 
      font-family: 'Bebas Neue', cursive; letter-spacing: 1px;
    }

    .btn-facebook {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; 
      padding: 4px 12px; background: rgba(255, 255, 255, 0.06); color: #ffffff; 
      text-decoration: none; font-size: 0.75rem; font-weight: 500; border-radius: 5px; 
      border: 1px solid rgba(255, 255, 255, 0.15); transition: all 0.25s ease;
    }
    .btn-facebook:hover { background: #ffffff; color: #000000; border-color: #ffffff; }

    .no-results { text-align: center; padding: 40px; color: #888888; font-size: 1rem; display: none; }

    /* Audio Player */
    .audio-player-box {
      position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; align-items: center; gap: 12px;
      padding: 8px 16px 8px 12px; background: rgba(10, 10, 15, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 40px; backdrop-filter: blur(20px); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }
    .player-disc {
      width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #222, #000);
      border: 1.2px solid rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center;
      animation: spinDisc 4s linear infinite; animation-play-state: paused;
    }
    .player-disc.playing { animation-play-state: running; }
    .player-disc::after { content: ''; width: 6px; height: 6px; background: #fff; border-radius: 50%; }
    @keyframes spinDisc { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .player-info { display: flex; flex-direction: column; max-width: 110px; }
    .player-title { font-size: 0.72rem; font-weight: 600; color: #ffffff; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-status-wrapper { display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 4px; height: 4px; border-radius: 50%; background-color: #666; }
    .status-dot.active { background-color: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .player-status { font-size: 0.5rem; color: #888; font-weight: 600; }
    .volume-box { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.04); padding: 3px 8px; border-radius: 12px; }
    .volume-slider { -webkit-appearance: none; width: 35px; height: 3px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 8px; border-radius: 50%; background: #fff; cursor: pointer; }
    .player-toggle-btn { background: #ffffff; border: none; color: #020203; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>
  <canvas id="particles-canvas"></canvas>

  <div class="container">
    <div class="nav-header">
      <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก</a>
    </div>

    <div class="header-title">
      <h1 class="main-title">MEMBERS RADUBJUKKRAPHAT</h1>
    </div>

    <div class="search-box-wrapper">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="search-input" class="search-input" placeholder="ค้นหาชื่อสมาชิก..." onkeyup="filterMembers()">
    </div>

    <div id="members-wrapper">
      <div class="category-section boss" id="section-boss">
        <div class="category-header"><i class="fa-solid fa-crown" style="color:#ffd700; font-size:1.2rem;"></i><h2 class="category-title" style="color:#ffd700;">THE BOSS</h2></div>
        <div class="member-grid" id="grid-boss"></div>
      </div>
      <div class="category-section leader" id="section-leader">
        <div class="category-header"><i class="fa-solid fa-fire" style="color:#ff4757; font-size:1.2rem;"></i><h2 class="category-title" style="color:#ff4757;">LEADER</h2></div>
        <div class="member-grid" id="grid-leader"></div>
      </div>
      <div class="category-section support" id="section-support">
        <div class="category-header"><i class="fa-solid fa-shield-halved" style="color:#1e90ff; font-size:1.2rem;"></i><h2 class="category-title" style="color:#1e90ff;">SUPPORT</h2></div>
        <div class="member-grid" id="grid-support"></div>
      </div>
      <div class="category-section member" id="section-member">
        <div class="category-header"><i class="fa-solid fa-user-group" style="color:#2ed573; font-size:1.2rem;"></i><h2 class="category-title" style="color:#2ed573;">MEMBER</h2></div>
        <div class="member-grid" id="grid-member"></div>
      </div>
      <div id="no-results" class="no-results">ไม่พบรายชื่อสมาชิกที่ค้นหา</div>
    </div>
  </div>

  <audio id="bg-audio" loop preload="auto"><source id="audio-source" src="" type="audio/mpeg"></audio>

  <div class="audio-player-box">
    <div id="player-disc" class="player-disc"></div>
    <div class="player-info">
      <a id="player-music-link" href="#" target="_blank" class="player-title">กำลังโหลด...</a>
      <div class="player-status-wrapper">
        <span id="status-dot" class="status-dot"></span>
        <span id="player-status-text" class="player-status">STOPPED</span>
      </div>
    </div>
    <div class="volume-box">
      <i class="fa-solid fa-volume-high" style="font-size:0.6rem; color:#aaa;"></i>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.2">
    </div>
    <button id="player-btn" class="player-toggle-btn"><i id="player-icon" class="fa-solid fa-play"></i></button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const MUSIC_CONFIG = {
      songTitle: "NASTY BABE - ПАТРИКИ (Lyric video, 2025)",
      originalUrl: "https://youtu.be/aiigklosh-w?si=SrebT61qHH8B3WsD",
      musicFile: "music.mp3"
    };

    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class WhiteParticle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : canvas.height + 10;
        this.radius = Math.random() * 1.5 + 0.4;
        this.speedY = Math.random() * 0.3 + 0.1;
        this.speedX = (Math.random() - 0.5) * 0.15;
        this.opacity = Math.random() * 0.5 + 0.1;
      }
      update() { 
        this.y -= this.speedY; 
        this.x += this.speedX;
        if (this.y < -10 || this.x < 0 || this.x > canvas.width) this.reset(false); 
      }
      draw() {
        ctx.beginPath(); 
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; 
        ctx.shadowBlur = 4; ctx.shadowColor = '#ffffff';
        ctx.fill(); ctx.shadowBlur = 0;
      }
    }
    for (let i = 0; i < 35; i++) particles.push(new WhiteParticle());
    function animateParticles() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateParticles); }
    animateParticles();

    const mockupMembers = [

    ];

    function renderMembers(dataList) {
      document.getElementById('grid-boss').innerHTML = '';
      document.getElementById('grid-leader').innerHTML = '';
      document.getElementById('grid-support').innerHTML = '';
      document.getElementById('grid-member').innerHTML = '';

      dataList.forEach(m => {
        const roleLower = (m.role || 'member').toLowerCase();
        const gridElement = document.getElementById(`grid-${roleLower}`);
        if (!gridElement) return;

        let avatarHtml = m.avatar 
          ? `<img src="${m.avatar}" alt="${m.name}" class="avatar-img" onerror="this.outerHTML='<i class=\\'${m.iconClass || 'fa-solid fa-user'} avatar-icon\\'></i>'">`
          : `<i class="${m.iconClass || 'fa-solid fa-user'} avatar-icon"></i>`;

        const cardHtml = `
          <div class="member-card ${roleLower}" data-name="${(m.name || '').toLowerCase()}">
            <div class="avatar-wrapper">
              ${avatarHtml}
              <div class="status-indicator"></div>
            </div>
            <div class="member-info">
              <div class="rank-badge">${roleLower.toUpperCase()}</div>
              <div class="member-name">${m.name}</div>
              <a href="${m.facebook || '#'}" target="_blank" class="btn-facebook"><i class="fa-brands fa-facebook-f"></i> Facebook</a>
            </div>
          </div>
        `;
        gridElement.insertAdjacentHTML('beforeend', cardHtml);
      });
      filterMembers();
    }

    function filterMembers() {
      const keyword = document.getElementById('search-input').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.member-card');
      let totalVisible = 0;

      cards.forEach(card => {
        const name = card.getAttribute('data-name');
        if (name.includes(keyword)) { card.style.display = 'flex'; totalVisible++; }
        else { card.style.display = 'none'; }
      });

      ['boss', 'leader', 'support', 'member'].forEach(role => {
        const section = document.getElementById(`section-${role}`);
        const visibleCards = section.querySelectorAll(`.member-card[style*="display: flex"]`);
        section.style.display = (visibleCards.length > 0) ? "block" : "none";
      });

      document.getElementById('no-results').style.display = (totalVisible === 0) ? 'block' : 'none';
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCFAJqW44-Y_aHECz1GpJGckwjKn2SiX90",
      authDomain: "snowallstar-dc575.firebaseapp.com",
      projectId: "snowallstar-dc575",
      storageBucket: "snowallstar-dc575.firebasestorage.app",
      messagingSenderId: "829525776984",
      appId: "1:829525776984:web:8e0185d9646c03581bc82d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("settings").doc("index_page").get().then((doc) => {
      if (doc.exists) {
        const data = doc.data();
        if (data.bgUrl) document.body.style.backgroundImage = `url('${data.bgUrl}')`;
        if (data.siteIcon) document.getElementById('site-favicon').href = data.siteIcon;
      }
    });

    // ** เปลี่ยนชื่อ Collection ตามไฟล์ เช่น member1_members ถึง member5_members **
    const collectionName = "member4_members"; 

    db.collection(collectionName).onSnapshot((snapshot) => {
      const liveMembers = [];
      if (!snapshot.empty) {
        snapshot.forEach(doc => liveMembers.push(doc.data()));
        renderMembers(liveMembers);
      } else {
        renderMembers(mockupMembers);
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const audio = document.getElementById("bg-audio");
      const audioSource = document.getElementById("audio-source");
      const playerTitle = document.getElementById("player-music-link");
      const playerStatus = document.getElementById("player-status-text");
      const statusDot = document.getElementById("status-dot");
      const playerBtn = document.getElementById("player-btn");
      const playerIcon = document.getElementById("player-icon");
      const volumeSlider = document.getElementById("volume-slider");
      const playerDisc = document.getElementById("player-disc");

      audioSource.src = MUSIC_CONFIG.musicFile;
      audio.load();
      playerTitle.innerText = MUSIC_CONFIG.songTitle;
      playerTitle.href = MUSIC_CONFIG.originalUrl;

      audio.volume = 0.2;
      volumeSlider.value = 0.2;

      const savedTime = localStorage.getItem("music_time");
      if (savedTime !== null) { audio.currentTime = parseFloat(savedTime); }
      audio.addEventListener("timeupdate", () => { localStorage.setItem("music_time", audio.currentTime); });

      function playMusic() {
        audio.play().then(() => {
          playerIcon.className = "fa-solid fa-pause";
          playerStatus.innerText = "PLAYING";
          statusDot.classList.add("active");
          playerDisc.classList.add("playing");
          sessionStorage.setItem("music_user_stopped", "false");
        }).catch(() => {});
      }

      function pauseMusic() {
        audio.pause();
        playerIcon.className = "fa-solid fa-play";
        playerStatus.innerText = "STOPPED";
        statusDot.classList.remove("active");
        playerDisc.classList.remove("playing");
        sessionStorage.setItem("music_user_stopped", "true");
      }

      if (sessionStorage.getItem("music_user_stopped") !== "true") {
        playMusic();
        const startOnInteraction = (e) => {
          if (e.target.closest('#player-btn') || e.target.closest('#volume-slider')) return;
          if (audio.paused) playMusic();
          document.removeEventListener("click", startOnInteraction);
        };
        document.addEventListener("click", startOnInteraction);
      }

      playerBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (audio.paused) playMusic(); else pauseMusic();
      });

      volumeSlider.addEventListener("input", (e) => { audio.volume = parseFloat(e.target.value); });
    });
  </script>
</body>
</html>
