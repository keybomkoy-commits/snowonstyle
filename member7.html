<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link id="site-favicon" rel="icon" href="">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    html { background-color: #030305; visibility: visible; opacity: 1; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #030305; color: #ffffff; }

    #members-scroll-container { scrollbar-width: none; -ms-overflow-style: none; }
    #members-scroll-container::-webkit-scrollbar { display: none; }

    #bg-layer {
      position: fixed; inset: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #030305;
      z-index: 1; filter: brightness(0.6) contrast(1.1); transition: background-image 0.8s ease;
      will-change: transform;
    }

    .overlay { position: fixed; inset: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(3, 3, 5, 0.2) 0%, rgba(3, 3, 5, 0.9) 85%); z-index: 2; pointer-events: none; }
    #particles-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

    @keyframes guiSmoothEntrance {
      0% { opacity: 0; transform: translateY(15px); filter: blur(5px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .view-main {
      position: relative; z-index: 3; width: 100%; height: 100vh; display: flex; justify-content: space-between; align-items: center; padding: 50px 70px;
      animation: guiSmoothEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .view-main.hidden { opacity: 0; transform: scale(0.97); filter: blur(5px); pointer-events: none; position: absolute; }

    .top-left-brand {
      position: absolute; top: 35px; left: 50px; display: inline-flex; align-items: center; gap: 10px;
      color: #e0d8c3; text-decoration: none; font-size: 0.85rem; font-weight: 500; letter-spacing: 2px;
      padding: 8px 16px; background: rgba(15, 15, 20, 0.5); border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px; backdrop-filter: blur(10px); transition: all 0.3s ease; z-index: 10;
    }
    .top-left-brand:hover { color: #fff; background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
    .brand-logo-icon { width: 20px; height: 20px; border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; }

    .left-hero { display: flex; flex-direction: column; gap: 8px; margin-top: 30px; }
    .hero-sub-line { display: flex; align-items: center; gap: 10px; font-size: 0.75rem; letter-spacing: 3px; color: #c49a45; text-transform: uppercase; font-weight: 600; }
    .hero-sub-line::before { content: ''; width: 20px; height: 1px; background: #c49a45; }
    
    .hero-title {
      font-family: 'Bebas Neue', cursive; font-size: clamp(5rem, 10.5vw, 9.5rem); letter-spacing: 8px;
      line-height: 0.88; text-transform: uppercase; color: #f4eee2; text-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .hero-custom-desc { font-size: 0.9rem; color: #9999a6; letter-spacing: 1.5px; font-weight: 400; max-width: 420px; line-height: 1.5; margin-top: 5px; }

    .right-menu-list { display: flex; flex-direction: column; gap: 12px; width: 385px; }
    
    .menu-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 22px; background: rgba(15, 15, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 4px;
      color: #ffd700; text-decoration: none; font-size: 1.25rem; font-weight: 600;
      letter-spacing: 1.5px; backdrop-filter: blur(10px); transition: all 0.35s ease; cursor: pointer; font-family: 'Bebas Neue', cursive;

    .menu-item:hover { 
      background: rgba(255, 215, 0, 0.15); border-color: rgba(255, 215, 0, 0.7); color: #fff;

    .view-members {

    .members-header-container { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; margin-bottom: 25px; width: 100%; }

    .search-box-wrapper { width: 100%; max-width: 450px; position: relative; margin: 0 auto; }
    .search-input {
      width: 100%; padding: 12px 18px 12px 45px; background: rgba(15, 15, 22, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #ffffff; font-size: 0.95rem; outline: none; transition: 0.3s;
    }
    .search-input:focus { border-color: rgba(255, 215, 0, 0.6); box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #888; }

    #members-scroll-container { flex-grow: 1; overflow-y: auto; overflow-x: hidden; max-width: 1250px; width: 100%; margin: 0 auto; padding: 0 15px 80px 15px; }

    .category-section { margin-bottom: 40px; display: none; }
    .category-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .category-header-left { display: flex; align-items: center; gap: 10px; }
    .category-title { font-family: 'Bebas Neue', cursive; font-size: 1.6rem; letter-spacing: 2px; color: #ffffff; }
    
    .member-count-badge { font-size: 0.7rem; font-weight: 600; padding: 2px 8px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; color: #aaa; letter-spacing: 1px; }

    .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; justify-content: center; }
    
    .member-card {
      background: rgba(18, 18, 26, 0.9); border: 1.2px solid rgba(255, 255, 255, 0.18); border-radius: 8px;
      padding: 10px 14px; display: flex; align-items: center; gap: 12px; transition: all 0.3s ease; position: relative; overflow: hidden; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);

    .member-card.boss { border-color: rgba(255, 215, 0, 0.45); background: rgba(22, 20, 12, 0.9); }
    .member-card.leader { border-color: rgba(255, 71, 87, 0.45); background: rgba(24, 14, 16, 0.9); }
    .member-card.support { border-color: rgba(30, 144, 255, 0.45); background: rgba(12, 18, 26, 0.9); }
    .member-card.xiii { border-color: rgba(223, 228, 234, 0.45); background: rgba(20, 20, 25, 0.9); }
    .member-card.member { border-color: rgba(46, 213, 115, 0.45); background: rgba(12, 24, 16, 0.9); }

    .avatar-wrapper { width: 48px; height: 48px; border-radius: 6px; flex-shrink: 0; background: rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .avatar-img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-icon { font-size: 1.4rem; color: #ffffff; }
    .status-indicator { position: absolute; bottom: 2px; right: 2px; width: 7px; height: 7px; background-color: #2ed573; border: 1.2px solid #08080c; border-radius: 50%; }

    .member-info { display: flex; flex-direction: column; align-items: flex-start; flex-grow: 1; overflow: hidden; }
    .rank-badge { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; margin-bottom: 1px; letter-spacing: 1px; }
    .member-card.boss .rank-badge { color: #ffd700; }
    .member-card.leader .rank-badge { color: #ff4757; }
    .member-card.support .rank-badge { color: #1e90ff; }
    .member-card.xiii .rank-badge { color: #dfe4ea; }
    .member-card.member .rank-badge { color: #2ed573; }

    .member-name { font-size: 1rem; font-weight: 700; color: #ffffff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; font-family: 'Bebas Neue', cursive; letter-spacing: 0.8px; }
    .btn-facebook {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 3px 10px;
      background: rgba(255, 255, 255, 0.08); color: #ffffff; text-decoration: none; font-size: 0.68rem; font-weight: 500; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.15); transition: 0.3s;
    }
    .btn-facebook:hover { background: #fff; color: #000; transform: scale(1.05); }
    .no-results { text-align: center; padding: 40px; color: #888; display: none; }

    .audio-player-box {
      position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; align-items: center; gap: 12px;
      padding: 8px 16px; background: rgba(10, 10, 15, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 40px; backdrop-filter: blur(20px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }
    .player-disc { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #222, #000); border: 1.2px solid rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; animation: spinDisc 4s linear infinite; animation-play-state: paused; }
    .player-disc.playing { animation-play-state: running; }
    .player-disc::after { content: ''; width: 6px; height: 6px; background: #fff; border-radius: 50%; }
    @keyframes spinDisc { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .player-info { display: flex; flex-direction: column; max-width: 110px; }
    .player-title { font-size: 0.72rem; font-weight: 600; color: #fff; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-status-wrapper { display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 4px; height: 4px; border-radius: 50%; background-color: #666; }
    .status-dot.active { background-color: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .player-status { font-size: 0.5rem; color: #888; font-weight: 600; }
    .volume-box { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.04); padding: 3px 8px; border-radius: 12px; }
    .volume-slider { -webkit-appearance: none; width: 35px; height: 3px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 8px; border-radius: 50%; background: #fff; cursor: pointer; }
    .player-toggle-btn { background: #fff; border: none; color: #020203; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    @media (max-width: 900px) {
      .view-main { flex-direction: column; justify-content: center; gap: 30px; padding: 20px; }
      .right-menu-list { width: 100%; }
      .top-left-brand { top: 20px; left: 20px; }
      .view-members { padding: 30px 20px; }
    }
  </style>
</head>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    function openMembersView() {
      document.getElementById('view-main').classList.add('hidden');
      document.getElementById('view-members').classList.add('active');
    }

    const MUSIC_CONFIG = {
      songTitle: "NASTY BABE - ПАТРИКИ (Lyric video, 2025)",
      originalUrl: "https://youtu.be/aiigklosh-w?si=SrebT61qHH8B3WsD",
      musicFile: "music.mp3"
    };

    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class WhiteParticle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : canvas.height + 10;
        this.radius = Math.random() * 1.5 + 0.4;
        this.speedY = Math.random() * 0.3 + 0.1;
        this.speedX = (Math.random() - 0.5) * 0.15;
        this.opacity = Math.random() * 0.5 + 0.1;
      }
      update() { this.y -= this.speedY; this.x += this.speedX; if (this.y < -10 || this.x < 0 || this.x > canvas.width) this.reset(false); }
      draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; ctx.fill(); }
    }
    for (let i = 0; i < 35; i++) particles.push(new WhiteParticle());
    function animateParticles() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateParticles); }
    animateParticles();

    function renderMembers(dataList) {
      ['boss', 'leader', 'support', 'xiii', 'member'].forEach(role => {
        document.getElementById(`grid-${role}`).innerHTML = '';
      });

      let counts = { boss: 0, leader: 0, support: 0, xiii: 0, member: 0 };

      dataList.forEach(m => {
        const roleLower = (m.role || 'member').toLowerCase();
        const gridElement = document.getElementById(`grid-${roleLower}`);
        if (!gridElement) return;

        counts[roleLower]++;

        let avatarHtml = '';
        if (m.avatar && m.avatar.trim() !== '') {
          avatarHtml = `<img src="${m.avatar.trim()}" alt="${m.name || 'Member'}" class="avatar-img" loading="lazy" crossorigin="anonymous" onerror="this.onerror=null; this.outerHTML='<i class=\\'${m.iconClass || 'fa-solid fa-user'} avatar-icon\\'></i>';">`;
        } else {
          avatarHtml = `<i class="${m.iconClass || 'fa-solid fa-user'} avatar-icon"></i>`;
        }

        const cardHtml = `
          <div class="member-card ${roleLower}" data-name="${(m.name || '').toLowerCase()}">
            <div class="avatar-wrapper">
              ${avatarHtml}
              <div class="status-indicator"></div>
            </div>
            <div class="member-info">
              <div class="rank-badge">${roleLower.toUpperCase()}</div>
              <div class="member-name">${m.name}</div>
              <a href="${m.facebook || '#'}" target="_blank" class="btn-facebook"><i class="fa-brands fa-facebook-f"></i> Facebook</a>
            </div>
          </div>
        `;
        gridElement.insertAdjacentHTML('beforeend', cardHtml);
      });

      document.getElementById('count-boss').innerText = `${counts.boss} คน`;
      document.getElementById('count-leader').innerText = `${counts.leader} คน`;
      document.getElementById('count-support').innerText = `${counts.support} คน`;
      document.getElementById('count-xiii').innerText = `${counts.xiii} คน`;
      document.getElementById('count-member').innerText = `${counts.member} คน`;

      filterMembers();
    }

    function filterMembers() {
      const keyword = document.getElementById('search-input').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.member-card');
      let totalVisible = 0;

      cards.forEach(card => {
        const name = card.getAttribute('data-name');
        if (name.includes(keyword)) { card.style.display = 'flex'; totalVisible++; }
        else { card.style.display = 'none'; }
      });

      ['boss', 'leader', 'support', 'xiii', 'member'].forEach(role => {
        const section = document.getElementById(`section-${role}`);
        const visibleCards = section.querySelectorAll(`.member-card[style*="display: flex"]`);
        section.style.display = (visibleCards.length > 0) ? "block" : "none";
      });

      document.getElementById('no-results').style.display = (totalVisible === 0) ? 'block' : 'none';
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCFAJqW44-Y_aHECz1GpJGckwjKn2SiX90",
      authDomain: "snowallstar-dc575.firebaseapp.com",
      projectId: "snowallstar-dc575",
      storageBucket: "snowallstar-dc575.firebasestorage.app",
      messagingSenderId: "829525776984",
      appId: "1:829525776984:web:8e0185d9646c03581bc82d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const settingDocId = "member_page_7";   
    const collectionName = "member7_members"; 

    db.collection("settings").doc(settingDocId).onSnapshot((doc) => {
      if (doc.exists) {
        const data = doc.data();
        if (data.subText) document.getElementById('txt-sub').innerText = data.subText;
        if (data.title) document.getElementById('txt-title').innerText = data.title;
        if (data.desc) document.getElementById('txt-desc').innerText = data.desc;
        if (data.menuText) document.getElementById('txt-menu').innerText = data.menuText;
        if (data.bgUrl) document.getElementById('bg-layer').style.backgroundImage = `url('${data.bgUrl}')`;
        if (data.membersBgUrl) {
          const mBg = document.getElementById('members-bg-layer');
          mBg.style.backgroundImage = `url('${data.membersBgUrl}')`;
          mBg.style.display = 'block';
        }
      }
    });

    db.collection(collectionName).onSnapshot((snapshot) => {
      const liveMembers = [];
      if (!snapshot.empty) {
        snapshot.forEach(doc => liveMembers.push(doc.data()));
        renderMembers(liveMembers);
      } else {
        renderMembers([]);
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const audio = document.getElementById("bg-audio");
      const audioSource = document.getElementById("audio-source");
      const playerTitle = document.getElementById("player-music-link");
      const playerStatus = document.getElementById("player-status-text");
      const statusDot = document.getElementById("status-dot");
      const playerBtn = document.getElementById("player-btn");
      const playerIcon = document.getElementById("player-icon");
      const volumeSlider = document.getElementById("volume-slider");
      const playerDisc = document.getElementById("player-disc");

      audioSource.src = MUSIC_CONFIG.musicFile;
      audio.load();
      playerTitle.innerText = MUSIC_CONFIG.songTitle;
      playerTitle.href = MUSIC_CONFIG.originalUrl;
      audio.volume = 0.2;
      volumeSlider.value = 0.2;

      const savedTime = localStorage.getItem("music_time");
      if (savedTime !== null) { audio.currentTime = parseFloat(savedTime); }
      audio.addEventListener("timeupdate", () => { localStorage.setItem("music_time", audio.currentTime); });

      function playMusic() {
        audio.play().then(() => {
          playerIcon.className = "fa-solid fa-pause";
          playerStatus.innerText = "PLAYING";
          statusDot.classList.add("active");
          playerDisc.classList.add("playing");
          sessionStorage.setItem("music_user_stopped", "false");
        }).catch(() => {});
      }

      function pauseMusic() {
        audio.pause();
        playerIcon.className = "fa-solid fa-play";
        playerStatus.innerText = "STOPPED";
        statusDot.classList.remove("active");
        playerDisc.classList.remove("playing");
        sessionStorage.setItem("music_user_stopped", "true");
      }

      if (sessionStorage.getItem("music_user_stopped") !== "true") {
        playMusic();
        const startOnInteraction = (e) => {
          if (e.target.closest('#player-btn') || e.target.closest('#volume-slider')) return;
          if (audio.paused) playMusic();
          document.removeEventListener("click", startOnInteraction);
        };
        document.addEventListener("click", startOnInteraction);
      }

      playerBtn.addEventListener("click", (e) => { e.stopPropagation(); if (audio.paused) playMusic(); else pauseMusic(); });
      volumeSlider.addEventListener("input", (e) => { audio.volume = parseFloat(e.target.value); });
    });
  </script>
</body>
</html>
